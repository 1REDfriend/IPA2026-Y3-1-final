[routers]
target

[routers:vars]
# The router address comes from the request (extra var "router").
ansible_host="{{ router }}"
ansible_connection=ansible.netcommon.network_cli
ansible_network_os=cisco.ios.ios
ansible_network_cli_ssh_type=paramiko
ansible_command_timeout=12
ansible_connect_timeout=8
# Credentials are read from the environment, never stored in the repo.
ansible_user="{{ lookup('env', 'ROUTER_USER') }}"
ansible_password="{{ lookup('env', 'ROUTER_PASS') }}"
